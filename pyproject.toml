[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libras-translator"
version = "0.1.0"
description = "Pesquisa e treinamento de modelos para reconhecimento de sinais isolados de Libras."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.11,<4.12",
    "optuna>=4.5,<6",
    "pandas>=2.2,<3",
    "Pillow>=10,<13",
    "scipy>=1.11,<2",
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
]

[project.scripts]
libras-translator = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*", "dataset*", "preprocessor*", "models*", "training*"]
namespaces = true
