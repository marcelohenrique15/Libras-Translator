[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libras-translator"
version = "0.1.0"
description = "Pesquisa e treinamento de modelos para reconhecimento de sinais isolados de Libras."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "torch>=2.3,<3",
]

[project.scripts]
libras-translator = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*", "dataset*"]
namespaces = true