# Cada tentativa usa as mesmas validações; Optuna maximiza o F1-macro médio.
n_trials = 20
n_startup_trials = 5

[parameters]
learning_rate = {type = "float", low = 0.00001, high = 0.001, log = true}
weight_decay = {type = "float", low = 0.0, high = 0.001}
batch_size = [32, 64]
# Limite da busca; o treino final usa a mediana das melhores épocas da vencedora.
epochs = [15, 30, 45]
l1_lambda = [0.0, 0.0000001, 0.000001]
l2_lambda = [0.0, 0.000001, 0.00001]
label_smoothing = [0.0, 0.05, 0.1]

[parameters.model_options]
hidden_size = [64, 128, 256]
num_layers = [1, 2]
dropout = {type = "float", low = 0.2, high = 0.6}
trainable_layers = ["fc", "layer4,fc"]
