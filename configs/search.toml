# Cada tentativa usa as mesmas validações; Optuna maximiza o F1-macro médio.
n_trials = 20
n_startup_trials = 5

[parameters]
learning_rate = {type = "float", low = 0.00001, high = 0.001, log = true}
weight_decay = {type = "float", low = 0.0, high = 0.001}
batch_size = [32, 64]

[parameters.model_options]
hidden_size = [64, 128, 256]
dropout = {type = "float", low = 0.1, high = 0.5}
