dataset = "data/minds_libras"
dataset_format = "minds_libras"
model = "resnet18"
processor = "landmarks"
test_signer_id = "05"
# Teto das validações internas; a duração final deriva das melhores épocas.
epochs = 1000
batch_size = 64
learning_rate = 0.0001
weight_decay = 0.0001
l1_lambda = 0.0
l2_lambda = 0.0
label_smoothing = 0.05
gradient_clip = 1.0
# Épocas consecutivas sem superar o melhor F1 de validação.
patience = 20
device = "auto"
num_workers = 0
seed = 42
output_dir = "runs"
weights_dir = "weights"
search_config = "configs/search.toml"

[model_options]
pretrained = true
hidden_size = 128
num_layers = 1
dropout = 0.5
trainable_layers = ["layer4", "fc"]

[processor_options]
subset = "asl_2nd"
imputation = true
anchor = "shoulders"
augmentation = false
image_size = 224
