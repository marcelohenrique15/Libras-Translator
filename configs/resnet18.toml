dataset = "data/minds_libras"
dataset_format = "minds_libras"
model = "resnet18"
processor = "landmarks"
test_signer_id = "05"
epochs = 30
batch_size = 64
learning_rate = 0.0001
weight_decay = 0.0001
patience = 5
device = "auto"
num_workers = 0
seed = 42
output_dir = "runs"
weights_dir = "weights"

[model_options]
pretrained = true
hidden_size = 128
dropout = 0.5
trainable_layers = ["layer4", "fc"]

[processor_options]
subset = "asl_2nd"
imputation = true
augmentation = true
image_size = 224
