# O modelo final da execução concluída mais recente em runs/.
checkpoint = "auto"
source = 0
width = 960
height = 540
# Tamanho inicial da janela de visualização, independente da captura.
window_width = 1280
window_height = 720
fps = 30.0
device = "auto"

# O contexto cresce; não é necessário esperar o limite para emitir hipóteses.
window_seconds = 6.0
min_window_seconds = 0.6
sample_fps = 30.0
prediction_interval = 0.15
confidence_threshold = 0.7
preview_confidence_threshold = 0.5
stability_count = 2
caption_hold_seconds = 2.0
hand_pause_seconds = 0.6
max_frame_gap = 0.35
person_timeout = 0.6
max_prediction_age = 1.2
cpu_threads = 2

# Espelha somente a visualização, nunca os dados enviados ao modelo.
mirror = true
